[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov=routes
    --cov=utils
    --cov-report=term-missing
    --cov-report=html
markers =
    slow: testes que demoram mais de 1s
    integration: testes que dependem do banco de dados
    security: testes de segurança
filterwarnings =
    ignore::DeprecationWarning
name: Tests & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Banco de dados PostgreSQL isolado para os testes
    services:
      postgres:
        image: postgres:15.6-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: controle_familiar_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U test_user; do
            echo "Aguardando banco de dados..."
            sleep 2
          done

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5433/controle_familiar_test
        run: |
          psql $DATABASE_URL -f migrations/001_add_indexes.sql
          psql $DATABASE_URL -f migrations/002_token_blacklist.sql

      - name: Run Tests with Coverage Gate
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://test_user:test_password@localhost:5433/controle_familiar_test
          SECRET_KEY: test_secret_key_minimum_32_chars_long_for_testing_purposes_only
          JWT_SECRET_KEY: test_jwt_secret_key_minimum_32_chars_long_for_testing_only
          CORS_ORIGINS: "http://localhost:5173"
          DATABASE_SSLMODE: disable
        run: |
          pytest \
            --cov=app \
            --cov=routes \
            --cov=utils \
            --cov=connection \
            --cov-fail-under=85 \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}